<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Lab Komputer</title>
  <!-- Library HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 20px;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
    }
    #result-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .success { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
    .warning { background-color: #feebc8; color: #742a2a; border: 1px solid #fbd38d; }
    .error { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
    
    /* Style Tombol Siswa Belum Absen */
    .unabsent-section {
      margin-top: 20px;
    }
    .btn-toggle {
      width: 100%;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: white;
      border: none;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .dropdown-content {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .unabsent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
      color: #718096;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 6px;
    }
    .btn-refresh {
      background: #edf2f7;
      color: #4a5568;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .unabsent-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 240px;
      overflow-y: auto;
    }
    .unabsent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f7fafc;
      font-size: 14px;
    }
    .btn-sakit {
      background: #3182ce;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 4px;
    }
    .btn-izin {
      background: #dd6b20;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📷 Scan QR Code Absensi</h2>
  
  <!-- KAMERA SCANNER -->
  <div id="reader"></div>

  <!-- POPUP RESULT -->
  <div id="result-box"></div>

  <!-- TOMBOL DAFTAR SISWA BELUM ABSEN -->
  <div class="unabsent-section">
    <button id="btn-toggle-unabsent" class="btn-toggle" onclick="toggleUnabsentList()">
      <span>📋 SISWA BELUM ABSEN</span>
      <span id="arrow-icon">▼</span>
    </button>

    <div id="content-unabsent" class="dropdown-content">
      <div class="unabsent-header">
        <span>Tandai siswa berhalangan:</span>
        <button class="btn-refresh" onclick="loadUnabsentList()">🔄 Refresh</button>
      </div>
      <ul id="list-unabsent" class="unabsent-list">
        <li style="text-align: center; color: #a0aec0; padding: 8px;">Klik tombol di atas untuk memuat data.</li>
      </ul>
    </div>
  </div>
</div>

<script>
  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw-RPrSPDu3KgYTtlcYj4m3UTPiOzyYw5LwQRdyJVTDx4Zz9g-I--iFHqrY8pwz59sD/exec"; 

  var isProcessing = false;
  var currentClass = "X TKR";

  // 1. KAMERA & PROSES SCAN QR CODE
  function onScanSuccess(decodedText, decodedResult) {
    if (isProcessing) return;
    isProcessing = true;

    var resultBox = document.getElementById("result-box");
    resultBox.style.display = "block";
    resultBox.className = "warning";
    resultBox.innerHTML = "⏳ Memproses data...";

    fetch(WEB_APP_URL + "?id=" + encodeURIComponent(decodedText))
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          currentClass = data.kelas || currentClass;
          if (data.absenStatus === "HADIR") {
            resultBox.className = "success";
            resultBox.innerHTML = "✅ " + data.nama + " (" + data.kelas + ")<br>Status: HADIR";
          } else if (data.absenStatus === "TERLAMBAT") {
            resultBox.className = "warning";
            resultBox.innerHTML = "⚠️ " + data.nama + " (" + data.kelas + ")<br>Status: TERLAMBAT";
          } else {
            resultBox.className = "warning";
            resultBox.innerHTML = "ℹ️ " + data.nama + "<br>" + data.absenStatus;
          }

          if (document.getElementById("content-unabsent").style.display === "block") {
            loadUnabsentList();
          }
        } else {
          resultBox.className = "error";
          resultBox.innerHTML = "❌ " + (data.message || "Data tidak ditemukan");
        }
        
        setTimeout(() => { isProcessing = false; }, 3000);
      })
      .catch(err => {
        resultBox.className = "error";
        resultBox.innerHTML = "❌ Gagal terhubung ke server.";
        setTimeout(() => { isProcessing = false; }, 3000);
      });
  }

  var html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
  html5QrcodeScanner.render(onScanSuccess);

  // 2. TOGGLE DROPDOWN & AMBIL DATA BELUM ABSEN
  function toggleUnabsentList() {
    var content = document.getElementById("content-unabsent");
    var arrow = document.getElementById("arrow-icon");
    
    if (content.style.display === "none" || content.style.display === "") {
      content.style.display = "block";
      arrow.textContent = "▲";
      loadUnabsentList();
    } else {
      content.style.display = "none";
      arrow.textContent = "▼";
    }
  }

  function loadUnabsentList() {
    var listUl = document.getElementById("list-unabsent");
    listUl.innerHTML = "<li style='text-align:center; color:#a0aec0; padding:8px;'>Memuat data...</li>";

    fetch(WEB_APP_URL + "?action=get_unabsent&kelas=" + encodeURIComponent(currentClass))
      .then(res => res.json())
      .then(data => {
        listUl.innerHTML = "";
        
        if (data.status === "success") {
          // KONDISI A: TIDAK ADA JADWAL AKTIF
          if (data.hasSchedule === false) {
            listUl.innerHTML = "<li style='text-align:center; color:#742a2a; padding:8px; font-weight:600;'>ℹ️ Tidak ada jadwal pembelajaran yang aktif saat ini</li>";
          } 
          // KONDISI B: ADA JADWAL & ADA SISWA BELUM ABSEN
          else if (data.unabsent && data.unabsent.length > 0) {
            data.unabsent.forEach(siswa => {
              var li = document.createElement("li");
              li.className = "unabsent-item";
              li.innerHTML = `
                <span><b>${siswa.nama}</b></span>
                <div>
                  <button class="btn-sakit" onclick="markStatus('${siswa.id}', 'SAKIT', '${siswa.kelas}')">Sakit</button>
                  <button class="btn-izin" onclick="markStatus('${siswa.id}', 'IZIN', '${siswa.kelas}')">Izin</button>
                </div>`;
              listUl.appendChild(li);
            });
          } 
          // KONDISI C: ADA JADWAL & SEMUA SISWA SUDAH ABSEN
          else {
            listUl.innerHTML = "<li style='text-align:center; color:#38a169; padding:8px; font-weight:600;'>🎉 Semua siswa sudah melakukan absensi!</li>";
          }
        } else {
          listUl.innerHTML = "<li style='text-align:center; color:#e53e3e; padding:8px;'>Gagal memuat data.</li>";
        }
      })
      .catch(err => {
        listUl.innerHTML = "<li style='text-align:center; color:#e53e3e; padding:8px;'>Gagal memuat data.</li>";
      });
  }

  // 3. SIMPAN MANUAL SAKIT / IZIN
  function markStatus(idSiswa, status, kelas) {
    fetch(WEB_APP_URL + "?action=input_manual&id_siswa=" + idSiswa + "&status=" + status + "&kelas=" + encodeURIComponent(kelas))
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        loadUnabsentList();
      })
      .catch(err => {
        alert("Gagal menyimpan data.");
      });
  }
</script>

</body>
</html>
