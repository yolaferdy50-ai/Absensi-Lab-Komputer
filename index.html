
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Lab Komputer</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #0f766e;
    }

    p {
      text-align: center;
      color: #475569;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #status {
      padding: 14px;
      border-radius: 8px;
      background: #e2e8f0;
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .berhasil {
      background: #dcfce7 !important;
      color: #166534;
    }

    .gagal {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .info {
      background: #dbeafe !important;
      color: #1e40af;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Absensi Lab Komputer</h2>
    <p>Arahkan kamera ke QR Code siswa.</p>

    <div id="reader"></div>

    <div id="status">
      Menyiapkan kamera...
    </div>

    <br>
    <button id="scanUlang" onclick="mulaiScanner()" hidden>
      Scan Ulang
    </button>
  </div>

  <script>
    // GANTI dengan URL Web App Apps Script Anda yang berakhiran /exec.
    const API_URL = "https://script.google.com/macros/s/AKfycbzcNu-XdFsz5G9lR5zXY5Z_ABSYTlSbj6VUY_i4Utm0FEGL0zEZjlxp1ZjJ415qCyHC/exec";

    let scanner = null;
    let sedangMemproses = false;

    function tampilkanStatus(pesan, jenis = "") {
      const elemen = document.getElementById("status");
      elemen.textContent = pesan;
      elemen.className = jenis;
    }

    async function mulaiScanner() {
      document.getElementById("scanUlang").hidden = true;
      sedangMemproses = false;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        tampilkanStatus("Meminta akses kamera...", "info");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          hasilQR => {
            if (sedangMemproses) return;

            sedangMemproses = true;
            prosesAbsensi(hasilQR);
          },
          () => {}
        );

        tampilkanStatus(
          "Kamera aktif. Silakan pindai QR Code siswa.",
          "info"
        );

      } catch (error) {
        tampilkanStatus(
          "Kamera gagal dibuka. Pastikan izin kamera diberikan dan situs menggunakan HTTPS. " +
          String(error),
          "gagal"
        );

        document.getElementById("scanUlang").hidden = false;
      }
    }

    async function prosesAbsensi(kodeQR) {
      try {
        tampilkanStatus("QR terbaca. Memproses absensi...", "info");

        if (
          API_URL === "TEMPEL_URL_WEB_APP_APPS_SCRIPT_DI_SINI" ||
          !API_URL.endsWith("/exec")
        ) {
          throw new Error("URL Web App Apps Script belum diatur dengan benar.");
        }

        await scanner.stop();

        const respons = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            kodeQR: kodeQR.trim()
          })
        });

        if (!respons.ok) {
          throw new Error("Server memberikan status HTTP " + respons.status);
        }

        const hasil = await respons.json();

        if (hasil.success) {
          tampilkanStatus(
            "ABSENSI BERHASIL\n" +
            "Nama: " + (hasil.nama || "-") + "\n" +
            "Kelas: " + (hasil.kelas || "-") + "\n" +
            "Mapel: " + (hasil.mapel || "-") + "\n" +
            "Status: " + (hasil.status || "-") + "\n" +
            "Jam: " + (hasil.jam || "-"),
            "berhasil"
          );
        } else {
          tampilkanStatus(
            hasil.message || "Absensi gagal diproses.",
            "gagal"
          );
        }

      } catch (error) {
        tampilkanStatus(
          "Gagal mengirim absensi: " + error.message,
          "gagal"
        );

        console.error(error);

      } finally {
        document.getElementById("scanUlang").hidden = false;
      }
    }

    document.addEventListener("DOMContentLoaded", mulaiScanner);
  </script>
</body>
</html>
