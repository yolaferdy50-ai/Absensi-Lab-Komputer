<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Lab Komputer - SMK Islam Inayah Ujungbatu</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #0ea5e9;
            --success-bg: #f0fdf4;
            --success-border: #86efac;
            --success-text: #166534;
            --danger-bg: #fef2f2;
            --danger-border: #fca5a5;
            --danger-text: #991b1b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            margin: 8px 0 4px 0;
            color: #fff;
        }
        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
        }
        .scanner-box {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            margin-bottom: 16px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-primary {
            background: #0ea5e9;
            color: white;
        }
        .btn-primary:hover {
            background: #0284c7;
        }
        /* Kartu Hasil Scan Modern */
        .result-card {
            display: none;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease-in-out;
            text-align: center;
        }
        .result-card.success {
            background: var(--success-bg);
            border: 2px solid var(--success-border);
            color: var(--success-text);
        }
        .result-card.danger {
            background: var(--danger-bg);
            border: 2px solid var(--danger-border);
            color: var(--danger-text);
        }
        .dept-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .student-name {
            font-size: 22px;
            font-weight: bold;
            margin: 5px 0;
        }
        .student-class {
            font-size: 15px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .status-badge {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 12px 0;
            text-transform: uppercase;
        }
        .scan-time {
            font-size: 14px;
            opacity: 0.8;
            font-family: monospace;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SMK Islam Inayah Ujungbatu</h1>
            <p>Scanner Kehadiran Absensi Lab Komputer</p>
        </div>

        <div class="scanner-box">
            <video id="video" playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>

        <button id="toggleBtn" class="btn btn-primary" onclick="toggleCamera()">Mulai Kamera Scanner</button>

        <!-- Kartu Hasil Scan -->
        <div id="resultCard" class="result-card">
            <img id="deptLogo" class="dept-logo" src="" alt="Logo Jurusan">
            <div id="resName" class="student-name">NAMA SISWA</div>
            <div id="resClass" class="student-class">KELAS / JURUSAN</div>
            <div id="resStatus" class="status-badge">HADIR</div>
            <div id="resTime" class="scan-time">00:00:00</div>
        </div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d");
        const toggleBtn = document.getElementById("toggleBtn");
        const resultCard = document.getElementById("resultCard");
        
        let scanning = false;
        let streamActive = null;

        // Daftar Logo Otomatis berdasarkan Jurusan (bisa diganti dengan URL gambar logo resmi Anda)
        const logoMap = {
            "TSM": "https://cdn-icons-png.flaticon.com/512/3063/3063823.png", // Ganti link logo TSM
            "TKR": "https://cdn-icons-png.flaticon.com/512/1995/1995574.png", // Ganti link logo TKR
            "TKJ": "https://cdn-icons-png.flaticon.com/512/1006/1006771.png", // Ganti link logo TKJ
            "PERBANKAN": "https://cdn-icons-png.flaticon.com/512/2830/2830284.png", // Ganti link Perbankan
            "APHP": "https://cdn-icons-png.flaticon.com/512/3076/3076897.png", // Ganti link APHP/LA
            "DEFAULT": "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        };

        function toggleCamera() {
            if (scanning) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(function(stream) {
                    streamActive = stream;
                    video.srcObject = stream;
                    video.setAttribute("playsinline", true);
                    video.play();
                    scanning = true;
                    toggleBtn.innerText = "Hentikan Kamera";
                    toggleBtn.className = "btn btn-danger";
                    requestAnimationFrame(tick);
                })
                .catch(function(err) {
                    alert("Gagal mengakses kamera: " + err);
                });
        }

        function stopCamera() {
            if (streamActive) {
                streamActive.getTracks().forEach(track => track.stop());
            }
            scanning = false;
            toggleBtn.innerText = "Mulai Kamera Scanner";
            toggleBtn.className = "btn btn-primary";
        }

        function tick() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                var imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    handleScanResult(code.data);
                    // Berhenti sejenak setelah scan sukses agar tidak double-scan
                    stopCamera();
                    setTimeout(startCamera, 4000); // Kamera aktif lagi setelah 4 detik
                }
            }
            requestAnimationFrame(tick);
        }

        function handleScanResult(dataText) {
            // Contoh format data QR code: "Abdul Faiz|X TSM|TERLAMBAT" atau disesuaikan
            let parts = dataText.split("|");
            let nama = parts[0] || "Siswa Teladan";
            let kelasJurusan = parts[1] || "X TSM";
            let status = parts[2] || "HADIR";
            
            let now = new Date();
            let timeString = now.toLocaleTimeString();

            // Deteksi Jurusan untuk Logo Otomatis
            let upperJK = kelasJurusan.toUpperCase();
            let selectedLogo = logoMap["DEFAULT"];
            if (upperJK.includes("TSM")) selectedLogo = logoMap["TSM"];
            else if (upperJK.includes("TKR")) selectedLogo = logoMap["TKR"];
            else if (upperJK.includes("TKJ")) selectedLogo = logoMap["TKJ"];
            else if (upperJK.includes("PERBANKAN")) selectedLogo = logoMap["PERBANKAN"];
            else if (upperJK.includes("APHP") || upperJK.includes("LA")) selectedLogo = logoMap["APHP"];

            // Render ke Kartu Tampilan
            document.getElementById("deptLogo").src = selectedLogo;
            document.getElementById("resName").innerText = nama;
            document.getElementById("resClass").innerText = kelasJurusan;
            document.getElementById("resStatus").innerText = status;
            document.getElementById("resTime").innerText = timeString;

            resultCard.className = "result-card success";
            if (status.toUpperCase().includes("TERLAMBAT") || status.toUpperCase().includes("ALPHA")) {
                resultCard.className = "result-card danger";
            }
            resultCard.style.display = "block";
        }
    </script>
</body>
</html>
